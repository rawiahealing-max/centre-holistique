<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة التحكم – Centre Holistique</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/admin.css?v=20261121i">
</head>
<body>

<!-- LOGIN -->
<section id="login" class="login" hidden>
  <div class="login-card">
    <img src="assets/icon-192.png" width="64" height="64" alt="">
    <h1>لوحة التحكم</h1>
    <p class="muted">ادخل بنفس الإيميل وكلمة السر متاع حسابك في الموقع.</p>
    <form id="f-login" class="grid">
      <label>البريد الإلكتروني<input name="email" type="email" dir="ltr" autocomplete="email" required></label>
      <label>كلمة السر<input name="password" type="password" dir="ltr" autocomplete="current-password" required></label>
      <button class="btn gold" type="submit">دخول</button>
    </form>
    <p class="status" id="login-msg" hidden></p>
    <p class="muted small">ما عندكش حساب؟ <a href="account.html?mode=signup" target="_blank">اعمل حساب من هنا</a>، ومن بعد يتعطاك دور «المسؤولة».</p>
  </div>
</section>

<!-- APP -->
<div id="app" class="app" hidden>
  <aside class="side" id="side">
    <div class="side-brand"><img src="assets/favicon.svg" width="32" height="32" alt=""><span>لوحة التحكم</span></div>
    <nav id="nav">
      <button data-view="home" class="active">📊 الرئيسية</button>
      <button data-view="orders">🧾 الطلبات <i class="cnt" id="cnt-orders"></i></button>
      <button data-view="clients">👥 الحرفاء</button>
      <button data-view="chat">💬 الشات <i class="cnt" id="cnt-chat"></i></button>
      <button data-view="lives">🔴 اللايفات</button>
      <button data-view="newsletter">💌 النشرة (الإيميلات)</button>
      <button data-view="lessons">🎓 محتوى الدورات</button>
      <button data-view="medits">🧘 التأملات</button>
      <button data-view="media">📁 الملفات</button>
      <button data-view="c:paiements">💳 طرق الدفع</button>
      <span class="nav-sep">محتوى الموقع</span>
      <button data-view="c:blog">📝 المدونة</button>
      <button data-view="c:soins">🌿 الجلسات</button>
      <button data-view="c:consult_tarifs">📞 أسعار الاستشارة أونلاين</button>
      <button data-view="c:lectures">🔮 قراءات التاروت</button>
      <button data-view="c:formations">🎓 الدورات</button>
      <button data-view="c:abonnements">✨ الاشتراك الشهري</button>
      <button data-view="c:evenements">📅 أحداث الشهر</button>
      <button data-view="c:packs">🎁 الباقات</button>
      <button data-view="c:temoignages">💬 الآراء</button>
      <button data-view="c:faq">❓ الأسئلة</button>
      <button data-view="c:categories">🏷️ أصناف الجلسات</button>
      <button data-view="c:medit_categories">🏷️ أصناف التأملات</button>
      <button data-view="settings">⚙️ الملف والتواصل</button>
    </nav>
    <div class="side-foot"><a href="index.html" target="_blank">↗ عرض الموقع</a><button id="logout" class="linkish">خروج</button></div>
  </aside>
  <main class="main">
    <header class="topbar"><button class="burger" id="burger">☰</button><h2 id="view-title"></h2><span class="me" id="me"></span></header>
    <div class="content" id="view"></div>
  </main>
</div>

<div class="dirty" id="dirty" hidden>تعديلات غير منشورة على محتوى الموقع <button class="btn gold" id="btn-save">انشر على الموقع</button></div>
<dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/courses-data.js?v=20261121i"></script>
<script src="assets/sb.js?v=20261121i"></script>
<script src="assets/admin.js?v=20261121i"></script>
</body>
</html>
